name: Vérification

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Base de démonstration
        run: npm run seed
      - name: Types TypeScript
        run: npx tsc --noEmit
      - name: Compilation
        run: npm run build
